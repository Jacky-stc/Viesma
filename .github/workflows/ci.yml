name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format:check
      - name: Unit tests
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser and server smoke
        id: smoke
        run: pnpm run test:smoke
      - name: Upload mobile jump trace
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-jump-trace
          path: node_modules/.cache/playwright/multiplayer/**/mobile-jump-trace.json
          include-hidden-files: true
          if-no-files-found: ignore
      - name: PostgreSQL health smoke
        run: |
          node -e "require('node:fs').writeFileSync('.env', 'POSTGRES_PASSWORD=' + require('node:crypto').randomBytes(24).toString('hex') + '\n', { flag: 'wx' })"
          docker compose config --quiet
          docker compose up --detach --wait --wait-timeout 90
          docker compose ps
      - name: Clean up PostgreSQL
        if: ${{ always() && hashFiles('.env') != '' }}
        run: docker compose down --volumes
